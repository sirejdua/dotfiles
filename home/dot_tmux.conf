# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set-option -g renumber-windows on

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

set -g mode-keys vi
set -g status-keys vi

set -g history-limit 65536

set -s set-clipboard on

set-option -sg escape-time 10


set-option -g focus-events on

# Size each window to the smallest client actively viewing it (not the
# smallest client merely attached). Prevents stale-width wrapping that
# garbles redraw-heavy TUIs (Claude Code) over ssh reconnects/resizes.
set -g aggressive-resize on

set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"
# set-option -sa terminal-overrides ',xterm-256color:RGB'

# true colours support
# set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-256color:Tc"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
# underscore colours - needs tmux-3.0
set -as terminal-overrides ',*:Setulc=\E[59::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
#set -g window-style 'fg=#d5a200,bg=#2c2b2b'
set -as terminal-overrides ',xterm-256color:Ms=\E]52;c%p1%.0s;%p2%s\007'

